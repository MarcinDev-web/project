# Test Infrastructure CI/CD Pipeline
#
# Runs comprehensive testing including:
# - Unit tests
# - Integration tests
# - Performance regression tests
# - Visual regression tests (WebGPU)
#
# Schedule:
# - On every PR
# - On push to main
# - Nightly (for performance baselines)

name: Test Infrastructure

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly at 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      update_baselines:
        description: 'Update performance baselines'
        required: false
        default: 'false'
        type: boolean
      update_goldens:
        description: 'Update visual golden masters'
        required: false
        default: 'false'
        type: boolean

env:
  CI: true
  NODE_ENV: test

jobs:
  # ===========================================================================
  # Unit Tests
  # ===========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm vitest run --project unit --reporter=verbose --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/unit/lcov.info
          flags: unit-tests
          fail_ci_if_error: false

  # ===========================================================================
  # Integration Tests
  # ===========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: pnpm vitest run --project integration --reporter=verbose

  # ===========================================================================
  # Performance Tests
  # ===========================================================================
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download baseline (if exists)
        uses: actions/download-artifact@v4
        with:
          name: performance-baselines
          path: test-results/
        continue-on-error: true

      - name: Run performance tests
        env:
          UPDATE_BASELINES: ${{ inputs.update_baselines || github.event_name == 'schedule' }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          pnpm vitest run packages/test-utils/__tests__/performance.example.test.ts --reporter=verbose

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: test-results/performance-*.json
          retention-days: 30

      - name: Upload baselines (if updated)
        if: ${{ inputs.update_baselines || github.event_name == 'schedule' }}
        uses: actions/upload-artifact@v4
        with:
          name: performance-baselines
          path: test-results/performance-baselines.json
          retention-days: 90

  # ===========================================================================
  # Visual Regression Tests
  # ===========================================================================
  visual-tests:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run visual tests
        env:
          UPDATE_GOLDENS: ${{ inputs.update_goldens }}
        run: |
          pnpm playwright test packages/gfx-webgpu/tests/visual/ --reporter=list

      - name: Upload visual test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Upload updated goldens (if requested)
        if: ${{ inputs.update_goldens }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-goldens
          path: packages/gfx-webgpu/tests/**/*-snapshots/
          retention-days: 30

  # ===========================================================================
  # WebGPU Compute Tests
  # ===========================================================================
  webgpu-compute-tests:
    name: WebGPU Compute Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run WebGPU compute tests
        run: |
          pnpm playwright test packages/gfx-webgpu/tests/compute/ --reporter=list

  # ===========================================================================
  # Summary Job
  # ===========================================================================
  test-summary:
    name: Test Summary
    needs: [unit-tests, integration-tests, performance-tests, visual-tests, webgpu-compute-tests]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check results
        run: |
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Performance Tests: ${{ needs.performance-tests.result }}"
          echo "Visual Tests: ${{ needs.visual-tests.result }}"
          echo "WebGPU Compute Tests: ${{ needs.webgpu-compute-tests.result }}"

      - name: Fail if any test failed
        if: |
          needs.unit-tests.result == 'failure' ||
          needs.integration-tests.result == 'failure' ||
          needs.performance-tests.result == 'failure' ||
          needs.visual-tests.result == 'failure' ||
          needs.webgpu-compute-tests.result == 'failure'
        run: exit 1

