name: perf

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  rust-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run benches (collision)
        working-directory: crates/collision
        run: cargo bench --bench collision -- --measurement-time 3 --warm-up-time 1 || true
      - name: Upload criterion reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-report
          path: crates/collision/target/criterion


