name: perf

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  rust-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run benches (collision)
        working-directory: crates/collision
        run: cargo bench --bench collision -- --measurement-time 3 --warm-up-time 1 || true
      - name: Upload criterion reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-report
          path: crates/collision/target/criterion

  typescript-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run collision benchmarks
        run: node --expose-gc --import tsx scripts/benchmark/collision.ts
        continue-on-error: true
      
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/
          retention-days: 30


