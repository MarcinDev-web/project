name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version type (major|minor|patch)'
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run tests
        run: pnpm test:unit:fast
      
      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@v4.6.0
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Bump version
        id: bump
        uses: phips28/gh-action-bump-version@master
        with:
          tag-prefix: 'v'
          version-type: ${{ github.event.inputs.version }}
          skip-tag: false
          skip-commit: false
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.newTag }}
          name: Release ${{ steps.bump.outputs.newTag }}
          body: |
            ## Changes
            
            ${{ steps.changelog.outputs.changelog }}
            
            ## Installation
            
            ```bash
            pnpm install
            ```
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

