name: Deploy to Production

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'shared/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      deploy_platform:
        description: 'Deploy Platform'
        type: boolean
        default: true
      deploy_editor:
        description: 'Deploy Editor'
        type: boolean
        default: true
      deploy_net_server:
        description: 'Deploy Net Server'
        type: boolean
        default: true
      deploy_collab_server:
        description: 'Deploy Collab Server'
        type: boolean
        default: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-prisma-changes:
    name: Check for Prisma Changes
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      net_server_changed: ${{ steps.check.outputs.net_server_changed }}
      collab_server_changed: ${{ steps.check.outputs.collab_server_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check for Prisma changes
        id: check
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Check if Prisma files changed in this commit
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep -E "(prisma/schema\.prisma|prisma/migrations/)" || true)
            if [ -n "$CHANGED_FILES" ]; then
              echo "has_changes=true" >> $GITHUB_OUTPUT
              if echo "$CHANGED_FILES" | grep -q "apps/net-server"; then
                echo "net_server_changed=true" >> $GITHUB_OUTPUT
              else
                echo "net_server_changed=false" >> $GITHUB_OUTPUT
              fi
              if echo "$CHANGED_FILES" | grep -q "apps/collab-server"; then
                echo "collab_server_changed=true" >> $GITHUB_OUTPUT
              else
                echo "collab_server_changed=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "has_changes=false" >> $GITHUB_OUTPUT
              echo "net_server_changed=false" >> $GITHUB_OUTPUT
              echo "collab_server_changed=false" >> $GITHUB_OUTPUT
            fi
          else
            # For manual triggers, check if Prisma paths are in changed files or assume changes
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "net_server_changed=true" >> $GITHUB_OUTPUT
            echo "collab_server_changed=true" >> $GITHUB_OUTPUT
          fi

  migrate-production:
    name: Run Production Migrations
    runs-on: ubuntu-latest
    needs: check-prisma-changes
    if: |
      ((github.event_name == 'push' && (contains(github.event.head_commit.message, '[deploy:net-server]') || contains(github.event.head_commit.message, '[deploy:collab-server]'))) ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy_net_server == 'true' || github.event.inputs.deploy_collab_server == 'true'))) &&
      (needs.check-prisma-changes.outputs.net_server_changed == 'true' || needs.check-prisma-changes.outputs.collab_server_changed == 'true')
    environment:
      name: production
    outputs:
      net_server_status: ${{ steps.migrate-net-server.outputs.status }}
      collab_server_status: ${{ steps.migrate-collab-server.outputs.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate migration status (net-server)
        if: |
          needs.check-prisma-changes.outputs.net_server_changed == 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          cd apps/net-server
          echo "🔍 Validating migration status for net-server (PRODUCTION)..."
          STATUS=$(pnpm prisma migrate status --schema=./prisma/schema.prisma 2>&1 || true)
          echo "$STATUS"
          if echo "$STATUS" | grep -q "Database schema is out of sync"; then
            echo "⚠️ Warning: Database schema is out of sync"
          fi
          if echo "$STATUS" | grep -q "Error"; then
            echo "❌ Error checking migration status"
            exit 1
          fi
          echo "✅ Migration status validated"

      - name: Run Prisma migrations (net-server)
        id: migrate-net-server
        if: needs.check-prisma-changes.outputs.net_server_changed == 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        continue-on-error: true
        run: |
          cd apps/net-server
          echo "🚀 Starting PRODUCTION migrations for net-server..."
          echo "⚠️ This will modify the production database!"
          set +e
          pnpm prisma migrate deploy --schema=./prisma/schema.prisma
          MIGRATE_EXIT=$?
          if [ $MIGRATE_EXIT -eq 0 ]; then
            echo "✅ Production migrations applied successfully"
            pnpm prisma generate --schema=./prisma/schema.prisma
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Production migration failed with exit code $MIGRATE_EXIT"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit $MIGRATE_EXIT
          fi
          set -e

      - name: Validate migration status (collab-server)
        if: |
          needs.check-prisma-changes.outputs.collab_server_changed == 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_COLLAB_DATABASE_URL }}
        run: |
          cd apps/collab-server
          echo "🔍 Validating migration status for collab-server (PRODUCTION)..."
          STATUS=$(pnpm prisma migrate status --schema=./prisma/schema.prisma 2>&1 || true)
          echo "$STATUS"
          if echo "$STATUS" | grep -q "Database schema is out of sync"; then
            echo "⚠️ Warning: Database schema is out of sync"
          fi
          if echo "$STATUS" | grep -q "Error"; then
            echo "❌ Error checking migration status"
            exit 1
          fi
          echo "✅ Migration status validated"

      - name: Run Prisma migrations (collab-server)
        id: migrate-collab-server
        if: needs.check-prisma-changes.outputs.collab_server_changed == 'true'
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_COLLAB_DATABASE_URL }}
        continue-on-error: true
        run: |
          cd apps/collab-server
          echo "🚀 Starting PRODUCTION migrations for collab-server..."
          echo "⚠️ This will modify the production database!"
          set +e
          pnpm prisma migrate deploy --schema=./prisma/schema.prisma
          MIGRATE_EXIT=$?
          if [ $MIGRATE_EXIT -eq 0 ]; then
            echo "✅ Production migrations applied successfully"
            pnpm prisma generate --schema=./prisma/schema.prisma
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Production migration failed with exit code $MIGRATE_EXIT"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit $MIGRATE_EXIT
          fi
          set -e

      - name: Verify migrations
        if: always()
        env:
          NET_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          COLLAB_DATABASE_URL: ${{ secrets.PRODUCTION_COLLAB_DATABASE_URL }}
        run: |
          echo "📊 Verifying production migration status..."
          
          if [ "${{ needs.check-prisma-changes.outputs.net_server_changed }}" == "true" ]; then
            echo "Checking net-server migrations..."
            cd apps/net-server
            pnpm prisma migrate status --schema=./prisma/schema.prisma || true
          fi
          
          if [ "${{ needs.check-prisma-changes.outputs.collab_server_changed }}" == "true" ]; then
            echo "Checking collab-server migrations..."
            cd apps/collab-server
            pnpm prisma migrate status --schema=./prisma/schema.prisma || true
          fi

      - name: Migration Summary
        if: always()
        run: |
          echo "## Migration Summary (Production)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Net Server: ${{ steps.migrate-net-server.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Collab Server: ${{ steps.migrate-collab-server.outputs.status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.migrate-net-server.outputs.status }}" == "failed" ] || [ "${{ steps.migrate-collab-server.outputs.status }}" == "failed" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Production migration failed!** Deployment will be blocked." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Production migrations completed successfully**" >> $GITHUB_STEP_SUMMARY
          fi

  deploy-platform:
    name: Deploy Platform (Vercel)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy:platform]')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_platform == 'true')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build platform
        run: pnpm build:platform

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PLATFORM_PROJECT_ID }}
          working-directory: apps/platform
          scope: ${{ secrets.VERCEL_ORG_ID }}
          vercel-args: '--prod'

  deploy-editor:
    name: Deploy Editor (Vercel)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy:editor]')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_editor == 'true')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build editor
        run: pnpm build:editor

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_EDITOR_PROJECT_ID }}
          working-directory: apps/editor
          scope: ${{ secrets.VERCEL_ORG_ID }}
          vercel-args: '--prod'

  deploy-net-server:
    name: Deploy Net Server (Railway)
    runs-on: ubuntu-latest
    needs: [check-prisma-changes, migrate-production]
    if: |
      ((github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy:net-server]')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_net_server == 'true')) &&
      (needs.migrate-production.result == 'success' || needs.migrate-production.result == 'skipped')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy to Railway
        uses: bervProject/railway-deploy@v0.3.3
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: net-server
          detach: false

  deploy-collab-server:
    name: Deploy Collab Server (Railway)
    runs-on: ubuntu-latest
    needs: [check-prisma-changes, migrate-production]
    if: |
      ((github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy:collab-server]')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_collab_server == 'true')) &&
      (needs.migrate-production.result == 'success' || needs.migrate-production.result == 'skipped')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy to Railway
        uses: bervProject/railway-deploy@v0.3.3
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: collab-server
          detach: false

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-platform, deploy-editor, deploy-net-server, deploy-collab-server]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "## Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "- Platform: ${{ needs.deploy-platform.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Editor: ${{ needs.deploy-editor.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Net Server: ${{ needs.deploy-net-server.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Collab Server: ${{ needs.deploy-collab-server.result }}" >> $GITHUB_STEP_SUMMARY

