services:
  - type: web
    name: collab-server
    env: node
    plan: starter
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: pnpm i --frozen-lockfile && pnpm -w --filter @apps/collab-server build
    startCommand: node apps/collab-server/dist/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: collab-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Add production editor origins when ready, comma-separated
      # e.g. https://editor.example.com,https://app.example.com
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173

  - type: postgres
    name: collab-db
    plan: starter
    region: frankfurt
    databaseName: collab
    user: collab
    ipAllowList: []


