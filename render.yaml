services:
  - type: web
    name: collab-server
    env: node
    plan: starter
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: pnpm i --frozen-lockfile && pnpm -w --filter @apps/collab-server build
    startCommand: node apps/collab-server/dist/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: collab-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Add production editor origins when ready, comma-separated
      # e.g. https://editor.example.com,https://app.example.com
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173

  - type: web
    name: net-server
    env: node
    plan: starter
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /health
    buildCommand: pnpm i --frozen-lockfile && pnpm -w --filter @apps/net-server build
    startCommand: node apps/net-server/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: net-server-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Update with your Vercel frontend URL after deployment
      # Format: https://your-app.vercel.app (or comma-separated for multiple)
      - key: FRONTEND_URL
        value: https://your-app.vercel.app

  - type: pg
    name: collab-db
    plan: starter
    region: frankfurt
    databaseName: collab
    user: collab

  - type: pg
    name: net-server-db
    plan: starter
    region: frankfurt
    databaseName: net_server
    user: net_server


