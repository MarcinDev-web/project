[package]
name = "ecs-core"
version = "0.1.0"
edition = "2021"
description = "WASM-accelerated ECS hot paths: queries, transform hierarchy, frustum culling"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
approx = "0.5"
criterion = "0.5"

[features]
default = []
simd = []
panic-hook = ["console_error_panic_hook"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Benchmarks (uncomment when bench file exists)
# [[bench]]
# name = "ecs_bench"
# harness = false

