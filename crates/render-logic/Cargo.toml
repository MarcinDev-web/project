[package]
name = "render-logic"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
glam = { version = "0.24", features = ["serde"] }
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }

