[package]
name = "wasm-spatial"
version = "0.1.0"
edition = "2021"
description = "High-performance spatial indexing for 3D game engines (BVH, Octree)"
authors = ["Engine Team"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = { version = "0.1", optional = true }

# SIMD support for performance
# packed_simd = { version = "0.3", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
# Optimize for speed
opt-level = 3
lto = true
codegen-units = 1

