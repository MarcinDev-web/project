<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Playverse Logo -->
  <!-- Design: Cartoon/stylized game controller aesthetic with blue/green colors -->
  
  <!-- Background circle (optional, can be removed for transparent) -->
  <!-- <circle cx="100" cy="100" r="95" fill="#0F172A" stroke="#1E293B" stroke-width="2"/> -->
  
  <!-- Play button triangle -->
  <polygon points="85,60 85,140 145,100" fill="#3B82F6" opacity="0.95"/>
  <polygon points="90,70 90,130 135,100" fill="#60A5FA" opacity="0.8"/>
  
  <!-- Circle around play button -->
  <circle cx="100" cy="100" r="55" fill="none" stroke="#10B981" stroke-width="4" opacity="0.9"/>
  <circle cx="100" cy="100" r="65" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
  
  <!-- Decorative elements (top and bottom) -->
  <g opacity="0.8">
    <!-- Top sparkles -->
    <circle cx="60" cy="40" r="3" fill="#10B981"/>
    <circle cx="52" cy="48" r="2" fill="#34D399"/>
    <circle cx="68" cy="35" r="2" fill="#34D399"/>
    
    <!-- Bottom sparkles -->
    <circle cx="140" cy="160" r="3" fill="#8B5CF6"/>
    <circle cx="148" cy="152" r="2" fill="#A78BFA"/>
    <circle cx="132" cy="165" r="2" fill="#A78BFA"/>
  </g>
  
  <!-- Game controller dots (decorative) -->
  <circle cx="55" cy="100" r="4" fill="#10B981" opacity="0.6"/>
  <circle cx="145" cy="100" r="4" fill="#8B5CF6" opacity="0.6"/>
</svg>
