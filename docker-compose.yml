services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forge}
      POSTGRES_USER: ${POSTGRES_USER:-forge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forge}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forge} -d ${POSTGRES_DB:-forge}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend
    ports:
      - "5432:5432"

  collab-server:
    build:
      context: .
      dockerfile: apps/collab-server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${COLLAB_PORT:-4000}
      DATABASE_URL: ${COLLAB_DATABASE_URL:-postgres://${POSTGRES_USER:-forge}:${POSTGRES_PASSWORD:-forge}@db:5432/${POSTGRES_DB:-forge}}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-dev}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "${COLLAB_PORT:-4000}:${COLLAB_PORT:-4000}"
    networks:
      - backend

  net-server:
    build:
      context: .
      dockerfile: apps/net-server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${NET_PORT:-3000}
      WS_PORT: ${WS_PORT:-3001}
      DATABASE_URL: ${NET_DATABASE_URL:-postgres://${POSTGRES_USER:-forge}:${POSTGRES_PASSWORD:-forge}@db:5432/${POSTGRES_DB:-forge}}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-dev}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "${NET_PORT:-3000}:3000"
      - "${WS_PORT:-3001}:3001"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  db_data:


