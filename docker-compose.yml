services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forge}
      POSTGRES_USER: ${POSTGRES_USER:-forge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forge}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forge} -d ${POSTGRES_DB:-forge}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backend
    ports:
      - "5432:5432"
    restart: unless-stopped

  collab-server:
    build:
      context: .
      dockerfile: apps/collab-server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${COLLAB_PORT:-4000}
      DATABASE_URL: ${COLLAB_DATABASE_URL:-postgres://${POSTGRES_USER:-forge}:${POSTGRES_PASSWORD:-forge}@db:5432/${POSTGRES_DB:-forge}?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-key-change-in-production-min-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-key-change-in-production-min-32-chars}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "${COLLAB_PORT:-4000}:4000"
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  net-server:
    build:
      context: .
      dockerfile: apps/net-server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${NET_PORT:-3000}
      WS_PORT: ${WS_PORT:-3001}
      DATABASE_URL: ${NET_DATABASE_URL:-postgres://${POSTGRES_USER:-forge}:${POSTGRES_PASSWORD:-forge}@db:5432/${POSTGRES_DB:-forge}?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-key-change-in-production-min-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-key-change-in-production-min-32-chars}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-5}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "${NET_PORT:-3000}:3000"
      - "${WS_PORT:-3001}:3001"
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  backend:
    driver: bridge

volumes:
  db_data:


