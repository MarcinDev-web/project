<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORGE Player - Play Game</title>
    
    <style>
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background: #000;
        color: #fafafa;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      #app {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
      }

      #status {
        position: fixed;
        top: 20px;
        left: 20px;
        margin: 0;
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.8);
        font-weight: 500;
        z-index: 100;
      }

      #exit-button {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 10px 20px;
        background: rgba(15, 19, 24, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        z-index: 100;
        transition: all 200ms ease;
      }

      #exit-button:hover {
        background: rgba(20, 25, 32, 0.85);
        border-color: rgba(255, 255, 255, 0.2);
      }

      .loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 2rem 3rem;
        background: rgba(15, 19, 24, 0.9);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        text-align: center;
        z-index: 1000;
      }

      .loading-spinner {
        width: 3rem;
        height: 3rem;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top-color: #4a9eff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 1rem;
      }

      .loading-message {
        color: rgba(255, 255, 255, 0.9);
        font-size: 1rem;
        margin-top: 1rem;
      }

      .error {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 2rem 3rem;
        background: rgba(220, 38, 38, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        text-align: center;
        z-index: 1000;
        color: #fff;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas></canvas>
      <div id="status">Initializing...</div>
      <button id="exit-button" style="display: none;">Exit</button>
      <div id="loading" class="loading" style="display: none;">
        <div class="loading-spinner"></div>
        <div class="loading-message">Loading game...</div>
      </div>
      <div id="error" class="error" style="display: none;"></div>
      <div id="hud-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
